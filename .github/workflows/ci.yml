name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run data:import:riyad -- --languages=ar,en
      - run: npm run data:import:quran-day
      - run: npm run data:import:urdu
      - run: npm run data:import:quran
      - run: npm run data:import:quran-editions
      - run: npm run test:backend
      - run: npm run build:server
      - run: npm run test:ssr
